<!doctype html>
<!--
  字雕试验台。只在开发期用（vite dev → /proto/sculpt.html），不进构建产物。
  三个机位并排：正读 0°、中途 45°、侧读 90°，最后一个可以拖。
-->
<html lang="zh-CN" data-palette="A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字雕试验台</title>
    <style>
      @import '../src/styles/palettes.css';
      body {
        margin: 0;
        padding: 28px;
        background: var(--cream);
        color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .row {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      canvas {
        display: block;
        width: 460px;
        height: 300px;
        background: var(--cream);
      }
      figcaption {
        margin-top: 8px;
        color: var(--ink-light);
        font-variant-numeric: tabular-nums;
      }
      #log {
        margin-top: 20px;
        color: var(--ink-faint);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <div id="log">booting…</div>
    <script type="module">
      import { createSculpt } from '../src/webgl/sculpt.ts'
      import { sculpt } from '../src/lib/sculpt.ts'

      const row = document.getElementById('row')
      const log = document.getElementById('log')
      const angles = [0, 30, 45, 90]
      const made = []

      for (const deg of angles) {
        const fig = document.createElement('figure')
        const c = document.createElement('canvas')
        const cap = document.createElement('figcaption')
        cap.textContent = `yaw ${deg}°`
        fig.append(c, cap)
        row.append(fig)
        const scene = createSculpt(c)
        if (!scene) {
          log.textContent = 'WebGL2 不可用'
          break
        }
        scene.setYaw((deg * Math.PI) / 180)
        scene.render()
        made.push({ scene, deg, cap })
      }

      if (made.length) {
        const last = made[made.length - 1]
        let drag = null
        last.scene.render()
        const c = row.lastElementChild.querySelector('canvas')
        c.style.cursor = 'grab'
        c.addEventListener('pointerdown', (e) => {
          drag = { x: e.clientX, y: last.deg }
          c.setPointerCapture(e.pointerId)
        })
        c.addEventListener('pointermove', (e) => {
          if (!drag) return
          last.deg = Math.max(-20, Math.min(110, drag.y + (e.clientX - drag.x) * 0.35))
          last.cap.textContent = `yaw ${last.deg.toFixed(1)}° (拖我)`
          last.scene.setYaw((last.deg * Math.PI) / 180)
          last.scene.render()
        })
        c.addEventListener('pointerup', () => (drag = null))

        log.textContent = [
          `暴露面实例 ${made[0].scene.faces.toLocaleString()}`,
          `网格 ${sculpt.colsA} × ${sculpt.rows} × ${sculpt.colsB}`,
          `公式 ${sculpt.formula}`,
          `双读保真 A ${sculpt.fidelity.a} / B ${sculpt.fidelity.b}`,
          `字形源 ${sculpt.source.family} ${sculpt.source.weight}`,
        ].join('\n')
      }
      document.documentElement.dataset.ready = '1'
    </script>
  </body>
</html>
