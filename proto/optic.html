<!doctype html>
<!-- 光学体试验台。vite dev → /proto/optic.html。四个滚动进度并排看形体与色散。 -->
<html lang="zh-CN" data-palette="A">
  <head>
    <meta charset="UTF-8" />
    <title>光学体试验台</title>
    <style>
      @import '../src/styles/palettes.css';
      :root {
        --optic-lo: #ccd4f0;
        --optic-hi: #fdf5f8;
      }
      body {
        margin: 0;
        background: #101014;
        color: #fff;
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
      figure {
        margin: 0;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 46vh;
      }
      figcaption {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font-family: ui-monospace, monospace;
        color: #1a1a2e;
        opacity: 0.75;
      }
      #log {
        padding: 8px 12px;
        font-family: ui-monospace, monospace;
        color: #9aa;
      }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <div id="log">booting…</div>
    <script type="module">
      import { createOptic } from '../src/webgl/optic.ts'

      const row = document.getElementById('row')
      const log = document.getElementById('log')
      const steps = [0, 0.34, 0.67, 1]
      const made = []
      let fail = ''

      for (const s of steps) {
        const fig = document.createElement('figure')
        const c = document.createElement('canvas')
        const cap = document.createElement('figcaption')
        cap.textContent = `scroll ${s.toFixed(2)}`
        fig.append(c, cap)
        row.append(fig)
        const sc = createOptic(c, 'high')
        if (!sc) {
          fail = 'WebGL2 建不起来'
          break
        }
        sc.setScroll(s)
        sc.render(0)
        made.push(sc)
      }

      log.textContent = fail || `已渲染 ${made.length} 个机位 · 全屏 raymarch · 零资产`
      document.documentElement.dataset.ready = '1'
    </script>
  </body>
</html>
