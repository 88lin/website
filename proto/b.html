<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · 控制台</title>
<style>
:root{
  --brand:#2B7FD8; --brand-deep:#1E5BA8; --brand-tint:#6FA9E6; --highlight:#F4D758;
  --pop:#E84A5F; --pop-deep:#C93449; --cream:#FEFCF6; --cream-dark:#FAF6EB;
  --ink:#1A1A2E; --ink-light:#4A4A5A; --ink-faint:#6E6E80;
  --gut:clamp(20px,4vw,60px);
  --sans:"Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --mono:"Noto Sans Mono CJK SC",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 整页三段弹性列：面板吃掉全部剩余高度，底部状态条永远完整落在视口里 */
body{background:var(--cream);color:var(--ink);font-family:var(--sans);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}

.top{display:flex;align-items:center;gap:1.1rem;padding:.85rem var(--gut);border-bottom:2px solid var(--ink);
  font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;flex:0 0 auto}
.top b{font-family:var(--sans);font-weight:900;font-size:1rem;letter-spacing:0}
.top__s{margin-inline-start:auto;display:flex;align-items:center;gap:.5rem;color:var(--ink-light)}
.dot{width:8px;height:8px;background:var(--brand);box-shadow:0 0 0 3px rgba(43,127,216,.22)}

.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);
  gap:clamp(1.4rem,3.2vw,3.2rem);align-items:stretch;
  padding:clamp(1.3rem,2.6vw,2.3rem) var(--gut);perspective:1600px}

.say{align-self:center;min-width:0}
.say h1{font-weight:900;font-size:clamp(2.1rem,4.6vw,3.95rem);line-height:1.06;letter-spacing:-.024em}
.say h1 i{font-style:normal;display:block}
.say h1 i:nth-child(2){margin-inline-start:.14em}
.mark{background:linear-gradient(transparent 58%,var(--highlight) 58%);padding-inline:.05em}
.blue{color:var(--brand-deep)}
.sub{margin-block-start:1.1rem;max-width:25em;font-size:clamp(.94rem,.88rem+.3vw,1.1rem);line-height:1.66;color:var(--ink-light)}
.cta{margin-block-start:1.45rem;display:flex;gap:.7rem;flex-wrap:wrap}
.btn{font-weight:700;font-size:.93rem;padding:.72rem 1.3rem;text-decoration:none;white-space:nowrap;
  border:2px solid var(--ink);background:var(--ink);color:var(--cream);box-shadow:5px 5px 0 var(--brand);
  transition:transform .16s,box-shadow .16s}
.btn--g{background:transparent;color:var(--ink);box-shadow:5px 5px 0 var(--pop)}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--brand)}
.btn--g:hover{box-shadow:3px 3px 0 var(--pop)}
.hint{margin-block-start:1.5rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;color:var(--ink-faint);
  border-inline-start:3px solid var(--highlight);padding-inline-start:.7rem;line-height:1.9}

/* 控制台面板：亮色，不是黑终端。transform-origin 用 left 会把右边缘甩出视口 */
.panel{background:var(--cream-dark);border:2px solid var(--ink);box-shadow:14px 14px 0 var(--pop-deep);
  transform:rotateY(-7deg) rotateX(1.4deg) scale(.968);transform-origin:center center;
  margin-inline-end:18px;min-width:0;display:flex;flex-direction:column}
.panel__bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;border-bottom:2px solid var(--ink);
  background:var(--brand-deep);color:#fff;font-family:var(--mono);font-size:.7rem;letter-spacing:.13em;flex:0 0 auto}
.sq{width:9px;height:9px}
.sq--y{background:var(--highlight)} .sq--p{background:var(--pop)} .sq--t{background:var(--brand-tint)}
.panel__t{margin-inline-start:.35rem}
.panel__meta{margin-inline-start:auto;color:#fff;opacity:.92}

.term{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);
  font-family:var(--mono);font-size:clamp(.7rem,.6rem+.32vw,.9rem);line-height:1.95}
.gut{background:var(--brand-deep);color:#fff;text-align:end;padding:.75rem .6rem;user-select:none;opacity:.95}
.gut span{display:block}
/* pre 而不是 pre-wrap：一行永远对一个行号，窄屏改为横向滚动 */
.code{padding:.75rem .95rem;white-space:pre;overflow-x:auto;overflow-y:hidden;min-width:0}
.code span{display:block;min-height:1.95em}
.c-cmd{color:var(--ink)} .c-cmd b{color:var(--pop-deep);font-weight:400}
.c-out{color:var(--ink-light)}
.c-key{color:var(--brand-deep);font-weight:700}
.c-cm{color:var(--ink-faint)}
.cur{display:inline-block;width:.56em;height:1.02em;background:var(--pop);vertical-align:-.16em;animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
/* 面板底栏：把面板下缘压住，空行区就不会读成没做完 */
.panel__foot{display:flex;align-items:center;gap:1.1rem;flex:0 0 auto;border-top:2px solid var(--ink);
  background:var(--brand-deep);color:#fff;font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;
  padding:.42rem .8rem}
.panel__foot .ok{color:var(--highlight)}
.panel__foot .r{margin-inline-start:auto}
.panel__foot span{white-space:nowrap}

.status{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);
  font-family:var(--mono);flex:0 0 auto}
.st{border-inline-end:1px solid rgba(26,26,46,.14);display:flex;align-items:baseline;gap:.5rem;
  padding:.55rem .9rem;font-size:.72rem;letter-spacing:.09em;color:var(--ink-faint)}
.st:first-child{padding-inline-start:var(--gut)}
.st:last-child{border-inline-end:0}
.st b{font-family:var(--sans);font-weight:900;font-size:1.02rem;letter-spacing:0;color:var(--ink)}
.st:nth-child(1) b{color:var(--pop-deep)} .st:nth-child(4) b{color:var(--brand-deep)}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;gap:1.4rem;padding-block:1.4rem;align-items:start}
  .say{align-self:start}
  .hint{display:none}
  .panel{transform:none;margin-inline-end:0;box-shadow:8px 8px 0 var(--pop-deep)}
  .term{font-size:.72rem;line-height:1.9}
  .panel__foot{font-size:.6rem;gap:.75rem;letter-spacing:.1em}
  .panel__foot .opt{display:none}
  .status{grid-template-columns:repeat(2,1fr)}
  .st{border-block-start:1px solid rgba(26,26,46,.14)}
  .st:first-child{padding-inline-start:.9rem}
  .st:nth-child(-n+2){border-block-start:0}
  .st:nth-child(5){grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<header class="top">
  <b>茉灵智库</b><span>@88lin</span>
  <span class="top__s"><i class="dot"></i>AI AGENT 工程 × 创意前端</span>
</header>

<div class="stage">
  <section class="say">
    <h1>
      <i>把前沿 <span class="blue">AI</span> 变成</i>
      <i>可<span class="mark">交付</span>、可维护</i>
      <i>的工程结果。</i>
    </h1>
    <p class="sub">接口会挂，平台会变，需求会改。我做的东西按「可切换」设计，所以到今天还活着。</p>
    <div class="cta">
      <a class="btn" href="#">聊聊合作</a>
      <a class="btn btn--g" href="#">看三个案例</a>
    </div>
    <p class="hint">右侧是 video_vip 里真实在用的降级配置<br>不是示意图，是跑了 1,784 天的那一份</p>
  </section>

  <section class="panel">
    <div class="panel__bar">
      <i class="sq sq--y"></i><i class="sq sq--p"></i><i class="sq sq--t"></i>
      <span class="panel__t">resilience.yml</span>
      <span class="panel__meta">88lin/video_vip</span>
    </div>
    <div class="term">
      <div class="gut" id="gut"></div>
      <div class="code" id="code"></div>
    </div>
    <div class="panel__foot">
      <span>YAML</span><span class="opt">UTF-8</span><span class="opt">LF</span>
      <span class="r"><i class="ok">●</i> 三条线在跑 · video_vip / lofi / repair</span>
    </div>
  </section>
</div>

<div class="status">
  <div class="st"><b>4,684</b>STARS</div>
  <div class="st"><b>502</b>FORKS</div>
  <div class="st"><b>22</b>原创仓库</div>
  <div class="st"><b>1,784</b>持续天数</div>
  <div class="st"><b>55</b>公开文章</div>
</div>

<script>
const LINES = [
  ['c-cm',  '# 不赌某一家接口活着，赌的是换得掉'],
  ['c-key', 'strategy: ordered-fallback'],
  ['c-key', 'providers:'],
  ['c-out', '  - id: primary      weight: 1.0'],
  ['c-out', '  - id: secondary    weight: 0.6'],
  ['c-out', '  - id: local        weight: 0.2   # 断网也能出结果'],
  ['c-key', 'on_error: [retry x2, degrade, next]'],
  ['c-key', 'contract: 输出格式与 provider 解耦'],
  ['', ''],
  ['c-cmd', '<b>$</b> 这套设计撑住了多久'],
  ['c-out', '  1,784 天 · 22 个原创仓库 · 至今在跑'],
  ['', ''],
  ['c-cmd', '<b>$</b> 换过几次上游'],
  ['c-out', '  3 次 · 每次改的是配置，不是业务代码'],
  ['', ''],
  ['c-cmd', '<b>$</b> 别人用了吗'],
  ['c-out', '  4,684 star · 502 fork · 144 关注者'],
];
const gut = document.getElementById('gut'), code = document.getElementById('code');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let li = 0, ci = 0;
function step(){
  if (li >= LINES.length) {
    code.lastElementChild.insertAdjacentHTML('beforeend','<i class="cur"></i>'); return }
  const [cls, txt] = LINES[li];
  if (ci === 0){
    gut.insertAdjacentHTML('beforeend', '<span>'+String(li+1).padStart(2,'0')+'</span>');
    code.insertAdjacentHTML('beforeend', '<span class="'+cls+'"></span>');
  }
  const el = code.lastElementChild;
  if (txt.startsWith('<b>')) { el.innerHTML = txt; ci = txt.length } else { el.textContent = txt.slice(0, ++ci) }
  if (ci >= txt.length){ li++; ci = 0; setTimeout(step, 110) } else { setTimeout(step, 15) }
}
if (reduce){
  LINES.forEach(([cls,txt],i)=>{
    gut.insertAdjacentHTML('beforeend','<span>'+String(i+1).padStart(2,'0')+'</span>');
    code.insertAdjacentHTML('beforeend','<span class="'+cls+'">'+txt+'</span>');
  });
} else { step() }
</script>
</body>
</html>
