<!doctype html>
<html lang="zh-CN" data-palette="A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 本站没有深色模式。这里声明一次，CSS 里再声明一次：系统开深色时
         浏览器不许自作主张反转表单控件与滚动条的配色。 -->
    <meta name="color-scheme" content="light" />
    <!--
      入场动效的开关，必须在**首次绘制之前**打上。

      预渲染的 HTML 里内容是可见的（这是「不要加载页」的前提）；
      而 .js 一挂上，[data-stagger] 就被藏起来等揭示。
      如果这个类是等 React 水合后才加的，用户会看到「先出现 → 突然消失 → 再揭示」
      闪一下 —— 首屏大标题上尤其明显，因为它走的是 clip-path 遮片。
      所以放在 head 里同步执行：第一帧就已经是藏好的状态。

      2.5 秒兜底是给「JS 加载失败 / 报错」准备的：真到那一步就把类摘掉，
      内容回到可见，绝不允许因为动效没跑起来而把正文永久藏住。
      App 启动后会写 data-booted，兜底就此作废。
    -->
    <script>
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        setTimeout(function () {
          if (!d.dataset.booted) d.classList.remove('js')
        }, 2500)
      })()
    </script>
    <meta name="site-seo-placeholder" />
    <!-- 站长平台所有权验证。这两条不进 seo.ts：它们不是从内容源现算的元数据，
         而是站点级的固定令牌，放在外壳里即可 —— 预渲染会把整段 head 复制到每条路由，
         dev 模式下原始 HTML 也带着，客户端切换路由时不会被 PageMetadata 摘掉。 -->
    <meta name="msvalidate.01" content="8E8B99B786171A5D199F348D0ACB6387" />
    <meta name="google-site-verification" content="8giVYWnLlMFeEyR1jB4K2d9BZb5TGbsXvKPrIorHbNI" />
    <!-- 与 body 的地面色一致（#fdfcf8）。差半档会让移动端的地址栏底色和页面接不上。 -->
    <meta name="theme-color" content="#FDFCF8" />
    <!-- 图标：奶油圆角方 + 竖黄条 + 三条递增的圆头横条。
         直接取自 repair.88lin.eu.org 那枚（用户指定），几何与配色不改。
         生成见 scripts/mkicon.py。

         浏览器在标签栏/书签/历史里会绕过下面这些 <link> 直接去要根目录的
         /favicon.ico，要不到就一直吃缓存里的旧图。所以 .ico 必须存在，
         且换图标时 ?v= 必须跟着涨 —— 现在是 ?v=15。
         .ico 必须排在 svg 前面：老浏览器按出现顺序取第一个能认的。
         注意：https://88lin.github.io/favicon.ico（主页仓库根目录）不在本仓库
         控制范围内，那一份要自己放过去。

         没有 mask-icon：它是 Safari 固定标签页用的，只取形状、颜色由 color 给，
         而 favicon.svg 是一整块实心底，挂上去会渲成一个纯色方块。 -->
    <link rel="icon" href="./favicon.ico?v=15" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=15" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=15" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=15" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=15" />
    <link rel="manifest" href="./site.webmanifest?v=15" />
    <!-- 一个字体都不预载。
         展示字（得意黑）排的是标题，font-display: swap 会先用系统字顶上；
         抢 LCP 带宽换那一点点换字抖动不划算。中文正文兜底（Noto Sans SC 子集）
         排在 PingFang SC / 本地思源黑之后，装了的机器一个字节都不下。
         手写体那一档已经删掉：版面上没有手写旁批，留着就是白付一次预载。 -->
  </head>
  <body>
    <!--
      方向契约
      THESIS: 一份可核验的接单档案。七章 00–06，每个数字都写了接口出处，
      折叠起来的「数字出处」随时能展开自查。页面本身就是最重要的那件作品。
      REJECT: 居中 Hero + 项目卡网格的模板页；千篇一律的卡片矩阵；卡里再套卡；
      标价；会倒退的数。
      OWN-WORLD: 暖白纸地面两档交替（都近白，加一层极淡纸纹），墨蓝是唯一结构色，
      柠檬黄只做实心重音块，珊瑚红只做编号与读数。得意黑排大标题，正文走苹果系统字
      （非 Apple 平台才下发思源黑子集），等宽只给测量与标签。
      LAYOUT: 每章一种构图，撞型即回炉 —— 开场是可拖的四张案例叠卡、服务是两栏
      分栏清单、案例是三列镜像账目行、作品是横推轨、主线是双轴加词表、
      写作是量表、联系是巨号邮箱压蓝块。
      MOTION: 一个 .is-in 驱动四层 —— 章头开幕四步、大字 clip-path 遮片揭示、
      量表按真实比例生长、顶栏进度条走 CSS scroll-timeline。无循环动画
      （作品轨的自动横滚是唯一例外，有暂停有边界，见 DESIGN §3.2）。
      STORY: 01 先回答「他能替我解决什么」，02/03 用案例与仓库兑现，
      06 给出邮箱、微信码与三步流程。带着一封写得出来的邮件离开。
      FINISH: 看起来能操作的东西必须真的能操作，且由脚本断言，不靠肉眼看截图。
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui">
        本站的动效需要 JavaScript，内容不需要。上面的正文是构建期就写死在 HTML 里的，可以直接读。也可以去
        <a href="https://github.com/88lin">GitHub</a> 或 <a href="https://blog.88lin.eu.org">博客</a>。
      </div>
    </noscript>
  </body>
</html>
