    <!-- v9 换标。旧标是深蓝底两个圆，跟站点配色毫无关系，缩到 16px 是一团糊。
         新标取「两条主线交在一个点」的同构形：两根粗斜杠加一个亮色节点，
         浅底（深底在浏览器标签栏反而糊），16px 下只剩一个叉和一个亮点，形状可辨。 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="mask-icon" href="./favicon.svg" color="#A8452F" />
    <!-- v8 起展示字换成思源黑 Black（22.6 KB 的中日韩子集），**不再预载**：
         实测把中日韩字体一起预载会在 1.6 Mbps 节流下抢掉 LCP 的带宽，为了一笔
         很小的 CLS 赔上半秒首屏，不划算。它走 font-display: swap，先用系统字顶。
         唯一的例外是手写体：只有 2 KB 出头，但首屏那句旁批就用它，不预载的话会在
         首屏画完之后才换字，制造全站唯一一处 CLS。font 预载必须带 crossorigin，
         同源也不例外。 -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/Caveat.woff2" crossorigin />
