    <!-- 本站没有深色模式。这里声明一次，CSS 里再声明一次：系统开深色时
         浏览器不许自作主张反转表单控件与滚动条的配色。 -->
    <meta name="color-scheme" content="light" />

    />

    <link rel="canonical" href="https://88lin.github.io/website/" />
    <!-- v10 图标：前九版每版都换了图形，但用户始终看到旧图标。真因不是图形没变，
         是站点从来没有过 favicon.ico。浏览器在标签栏/书签/历史里会绕过下面
         这些 <link> 直接去要根目录的 /favicon.ico，要不到就一直吃缓存里的旧图。
         所以这一版补齐 .ico 兜底 + 全尺寸 PNG + webmanifest，并全部挂 ?v=10 破缓存。
         .ico 必须排在 svg 前面：老浏览器按出现顺序取第一个能认的。
         注意：https://88lin.github.io/favicon.ico（用户主页仓库根目录）不在本仓库
         控制范围内，那一份要在 88lin/88lin.github.io 里自己放。 -->
    <link rel="icon" href="./favicon.ico?v=10" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=10" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=10" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=10" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=10" />
    <link rel="mask-icon" href="./favicon.svg?v=10" color="#2B7FD8" />
    <link rel="manifest" href="./site.webmanifest?v=10" />
    <!-- v10 起展示字是 Fraunces（两档拉丁子集，共 21 KB），中文全部走系统黑体栈。
         展示字**不预载**：它排的是标题，font-display: swap 会先用系统字顶上，
         抢 LCP 带宽换那一点点换字抖动不划算。唯一预载手写体：只有 2 KB 出头，
         但首屏那句旁批就用它，不预载就会在首屏画完之后才换字，制造全站唯一一处
         CLS。font 预载必须带 crossorigin，同源也不例外。 -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/Caveat.woff2" crossorigin />

  <body>
    <!--
      v12「活字付印 Typecast」方向契约
      THESIS: 整站是一本被精心保有、并最终付印的研究实验志，八章=八条编号实验
      （EXP.00–07），数字=带出处的测量值；首页封面钉着图版01「铸字盘」——
      首屏论点18个字铸成活字排在6×3字盘里，实时3D+同布局SVG降级。
      拒绝：居中Hero+项目卡网格的模板页。
      OWN-WORLD: 奶油坐标纸地面（两档纸色+极淡测量网格）；墨蓝唯一结构色；
      柠檬黄只做荧光笔；珊瑚红做印章与朱笔；深色只做锚点组件。Fraunces拉丁
      +系统黑体，活字一律衬线，等宽只给测量，Caveat只给旁批。
      STORY: 访客3秒内建立「此人前端水准极高且大胆」的判断→滚动读实验→
      在收口章带着邮箱离开。
      FIRST VIEWPORT: 左=刊头+三行巨字论点（荧光笔+手绘圈+邮箱命令行+CTA），
      右=手绘虚线框里的活字盘（视差微倾/悬停抬字/字面颜色=标题批注），
      框角盖核实章。偏心构图，不居中。
      FORM: 实验志的付印版——铅字是它的第一张图版。
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
