name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周二北京时间 08:45。刻意晚于 refresh-data.yml（08:23）：数据刷新会把结果
    # 提交回 main，等它落地后再构建，Pages 拿到的才是当天的新快照。
    - cron: '45 0 * * 2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:data
      - run: npm run test:server
      # 这里不再自己刷新数据：刷新由 refresh-data.yml 负责，它会把结果提交回 main，
      # 正式站点（Cloudflare Pages）从仓库构建，两边共用同一份快照。
      # 留下 refresh:data 只会让同一个定时任务里出现两份可能不一致的数字。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'fonttools[woff]' brotli
      - uses: actions/cache@v4
        with:
          path: .shots/fontsrc
          key: font-sources-v1
      - run: python scripts/prepare-fonts.py
      - run: npx playwright install --with-deps chromium
      # 同一工作流完成刷新和部署；不依赖机器人提交触发另一个工作流。
      - run: node scripts/build-pages.mjs
      - run: npm run verify:seo
      - run: npm run verify:runtime
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
